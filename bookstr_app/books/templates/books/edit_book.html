{% extends "books/base.html" %}

{% block content %}

<h1>Edit Book</h1>

<form method="POST">
    {% csrf_token %}

    <input
        type="text"
        name="title"
        value="{{ book.title }}"
    >

    <input
        type="text"
        name="author"
        value="{{ book.author }}"
    >

    <input
        type="number"
        name="pages"
        value="{{ book.pages }}"
    >

    <textarea name="description">{{ book.description }}</textarea>

    <button type="submit">
        Save Changes
    </button>

</form>

{% endblock %}
