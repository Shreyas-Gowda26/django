{% extends "books/base.html" %}

{% block content %}

<h1>Programming Books</h1>

{% for book in books %}
    <div>
        <h2>
            <a href="{% url 'book_detail' book.id %}">
                {{ book.title }}
            </a>
        </h2>

        <p>Author: {{ book.author }}</p>
        <hr>
    </div>
{% endfor %}

{% endblock %}
