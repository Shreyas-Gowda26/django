{% extends "books/base.html" %}

{% block content %}

<h1>Register</h1>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username">
    <br><br>
    <input type="password" name="password" placeholder="Password">
    <br><br>
    <button type="submit">Register</button>
</form>

{% endblock %}
